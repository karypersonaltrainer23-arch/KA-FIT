<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>KA-FIT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:0;
}

.app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  background:#050505;
}

/* IMÁGENES */
.hero-image,
.card-image,
.banner-image{
  display:block;
  width:100%;
  height:auto;
}

/* ENCABEZADO */
.hero{
  position:relative;
  width:100%;
}

.hero-image{
  width:100%;
}

/*
Los botones transparentes quedan encima de los botones
que ya aparecen dibujados en la imagen.
*/
.hero-menu{
  position:absolute;
  left:1.5%;
  top:1%;
  width:13%;
  height:10%;
  border:0;
  background:transparent;
  cursor:pointer;
}

.hero-exit{
  position:absolute;
  right:1%;
  top:1%;
  width:16%;
  height:9%;
  border:0;
  background:transparent;
  cursor:pointer;
}

/* TARJETAS */
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px 10px 0;
}

.card{
  position:relative;
  display:block;
  overflow:hidden;
  border-radius:14px;
  text-decoration:none;
  background:#080808;
}

.card-image{
  width:100%;
  height:auto;
}

/* Toda la tarjeta es pulsable */
.card-hit{
  position:absolute;
  inset:0;
  z-index:2;
}

/* BANNER */
.banner{
  margin:9px 10px 18px;
  border-radius:14px;
  overflow:hidden;
}

.banner-image{
  width:100%;
}

/* NAVEGACIÓN INFERIOR REAL */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:88px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(3,3,3,.97);
  border-top:1px solid #262626;
  display:flex;
  align-items:center;
  justify-content:space-around;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.nav-item{
  width:20%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#777;
  font-size:12px;
  gap:4px;
}

.nav-icon{
  font-size:25px;
  line-height:1;
}

.nav-item.active{
  color:#e9b83f;
}

.nav-item.active::after{
  content:"";
  width:45px;
  height:2px;
  border-radius:5px;
  background:#e9b83f;
  box-shadow:0 0 8px #e9b83f;
  margin-top:4px;
}

/* Ajuste para iPhone */
@media(max-width:390px){
  .cards{
    gap:6px;
    padding-left:7px;
    padding-right:7px;
  }

  .banner{
    margin-left:7px;
    margin-right:7px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ENCABEZADO EXACTO DEL BOCETO -->
  <section class="hero">
    <img
      class="hero-image"
      src="01_encabezado_ka-fit.jpg"
      alt="KA-FIT"
    >

    <button
      class="hero-menu"
      type="button"
      aria-label="Abrir menú"
      onclick="abrirMenu()">
    </button>

    <button
      class="hero-exit"
      type="button"
      aria-label="Salir"
      onclick="salir()">
    </button>
  </section>


  <!-- TARJETAS -->
  <section class="cards">

    <div class="card">
      <img
        class="card-image"
        src="02_mis_clientes.jpg"
        alt="Mis clientes"
      >
      <a
        class="card-hit"
        href="#"
        aria-label="Mis clientes">
      </a>
    </div>


    <div class="card">
      <img
        class="card-image"
        src="03_rutinas.jpg"
        alt="Rutinas"
      >
      <a
        class="card-hit"
        href="#"
        aria-label="Rutinas">
      </a>
    </div>


    <div class="card">
      <img
        class="card-image"
        src="04_progreso.jpg"
        alt="Progreso"
      >
      <a
        class="card-hit"
        href="#"
        aria-label="Progreso">
      </a>
    </div>


    <div class="card">
      <img
        class="card-image"
        src="05_agenda.jpg"
        alt="Agenda"
      >
      <a
        class="card-hit"
        href="#"
        aria-label="Agenda">
      </a>
    </div>

  </section>


  <!-- BANNER -->
  <section class="banner">
    <img
      class="banner-image"
      src="06_banner_disciplina.jpg"
      alt="Disciplina hoy, resultados siempre"
    >
  </section>

</div>


<!-- BARRA INFERIOR FUNCIONAL -->
<nav class="bottom-nav">

  <a href="#" class="nav-item active">
    <span class="nav-icon">⌂</span>
    <span>Inicio</span>
  </a>

  <a href="#" class="nav-item">
    <span class="nav-icon">♙</span>
    <span>Clientes</span>
  </a>

  <a href="#" class="nav-item">
    <span class="nav-icon">🏋️</span>
    <span>Rutinas</span>
  </a>

  <a href="#" class="nav-item">
    <span class="nav-icon">▥</span>
    <span>Progreso</span>
  </a>

  <a href="#" class="nav-item">
    <span class="nav-icon">▣</span>
    <span>Agenda</span>
  </a>

</nav>


<script>
function salir(){
  const confirmar = confirm("¿Quieres salir de KA-FIT?");

  if(confirmar){
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }
}

function abrirMenu(){
  alert("Menú KA-FIT");
}

/*
Por ahora evitamos que las secciones recarguen la página.
Después conectaremos cada una con su pantalla real.
*/
document.querySelectorAll('a[href="#"]').forEach(function(enlace){
  enlace.addEventListener("click",function(evento){
    evento.preventDefault();
  });
});
</script>

</body>
</html>
