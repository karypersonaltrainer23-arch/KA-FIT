<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KA-FIT | Recuperar contraseña</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0%,#46320f 0%,#0a0a0a 48%,#050505 100%);color:#f7f0df;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);border:1px solid #80652b;border-radius:20px;padding:28px;background:#101010;box-shadow:0 16px 60px #0009}h1{color:#e5bd57;font-size:30px;margin:0 0 8px}.subtitle{color:#c6bfae;line-height:1.5}label{display:block;margin:20px 0 8px;color:#e5bd57}input{width:100%;padding:14px;border:1px solid #a5853d;border-radius:10px;background:#1b1b1b;color:white;font-size:16px}button{margin-top:22px;width:100%;padding:15px;background:linear-gradient(120deg,#c39a34,#f3d471);border:0;border-radius:11px;color:#18120a;font-weight:750;font-size:16px}button:disabled{opacity:.5}#status{margin-top:20px;line-height:1.5;overflow-wrap:anywhere}.error{color:#ffaaa5}.ok{color:#a6e4bc}.muted{color:#c6bfae}a{color:#e5bd57}</style></head><body><main class="panel"><h1>KA-FIT</h1><p class="subtitle">Restablece tu contraseña de manera segura.</p><form id="form" hidden><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirmar contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Guardar nueva contraseña</button></form><p id="status" class="muted" role="status" aria-live="polite">Verificando tu enlace de recuperación…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(async()=>{
 const status=document.getElementById('status'),form=document.getElementById('form'),btn=document.getElementById('save');
 const set=(message,kind='muted')=>{status.textContent=message;status.className=kind};
 if(!window.supabase){set('No se pudo cargar la conexión segura. Comprueba tu conexión a Internet y vuelve a abrir el enlace.','error');return}
 const client=window.supabase.createClient('https://irrhixwfewphgksttvvr.supabase.co','sb_publishable_5IX7lfiye0TP6WYEB47S4A_cRgG1BgZ',{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
 const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
 if(query.get('error')||hash.get('error')){set('El enlace no es válido o ha expirado. Solicita uno nuevo desde Supabase.','error');return}
 try{
  let session=null;
  if(query.get('code')){const {data,error}=await client.auth.exchangeCodeForSession(query.get('code'));if(error)throw error;session=data.session}
  else if(hash.get('access_token')&&hash.get('refresh_token')){const {data,error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error)throw error;session=data.session}
  else {const {data}=await client.auth.getSession();session=data.session}
  if(!session){set('Abre esta página desde el enlace de recuperación recibido por correo. Si el enlace expiró, solicita uno nuevo.','error');return}
  history.replaceState({},'',location.pathname);
  form.hidden=false;set('Enlace verificado. Escribe tu nueva contraseña.');
  form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){set('Utiliza al menos 8 caracteres.','error');return}if(p!==c){set('Las contraseñas no coinciden.','error');return}btn.disabled=true;set('Guardando contraseña…');try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;form.hidden=true;set('Contraseña actualizada correctamente. Ya puedes regresar a KA-FIT e iniciar sesión con tu correo y nueva contraseña.','ok');await client.auth.signOut()}catch(err){set('No se pudo actualizar la contraseña: '+(err?.message||'Error desconocido'),'error');btn.disabled=false}})
 }catch(err){set('No se pudo validar el enlace: '+(err?.message||'enlace caducado')+'. Solicita un correo nuevo.','error')}
})();
</script></body></html>
